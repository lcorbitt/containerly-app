# https://supabase.com/docs/guides/cli/config
project_id = "containerly-app"

# -----------------------------------------------------------------------------
# Local email (Mailpit)
# -----------------------------------------------------------------------------
# After `supabase start`, open http://127.0.0.1:54324 — Auth emails (invites, magic links,
# password reset, optional sign-up confirmation) and Containerly transactional emails (when
# RESEND_API_KEY is unset in supabase/functions/.env) are captured there; nothing is sent externally.
# Transactional email uses Mailpit SMTP on the Docker network (inbucket:1025); see functions/.env.example.
#
# Next.js must call the same API URL as this stack (`supabase status` → Project URL) and use the
# Secret key server-side for admin.inviteUserByEmail (see frontend/.env.local.example + README).
#
# Sign-up: with enable_confirmations = false (below), new users can sign in immediately without a
# confirmation email; Mailpit stays quiet for sign-up only. Invites and password reset still appear
# in Mailpit. Set enable_confirmations = true to test confirmation links; then `supabase stop && supabase start`.

[auth]
# Base URL for links in Auth emails; must match where you run the Next app.
site_url = "http://localhost:3000"
# inviteUserByEmail redirectTo + common dev origins (exact URLs; add more if you use another port).
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/login",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/set-password",
  "http://localhost:3000/forgot-password",
  "http://127.0.0.1:3000",
  "http://127.0.0.1:3000/login",
  "http://127.0.0.1:3000/auth/callback",
  "http://127.0.0.1:3000/set-password",
  "http://127.0.0.1:3000/forgot-password",
]

[auth.email]
enable_confirmations = false

# Branded Auth emails — same layout as transactional mail in _services/email/email.service.ts.
# content_path is relative to the repo root (where you run `supabase start`).
# After edits: `supabase stop && supabase start`. For hosted projects, paste HTML into
# Dashboard → Authentication → Email Templates (see supabase/templates/README.md).

[auth.email.template.invite]
subject = "You've been invited to Containerly"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Containerly password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Sign in to Containerly"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your Containerly email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.email_change]
subject = "Confirm your new Containerly email address"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your Containerly verification code"
content_path = "./supabase/templates/reauthentication.html"

# Post-change password notice is sent via Resend (`notify-password-changed`), not Supabase Auth.
[auth.email.notification.password_changed]
enabled = false

[api]
enabled = true

[db]
major_version = 15

# Kong "verify_jwt" runs BEFORE your Edge code. Local CLI stacks often return "Invalid JWT" here
# even with a valid login (cookie/session vs gateway quirks). These functions still authenticate
# inside Deno via createUserClient(req) + auth.getUser() — anonymous calls fail there, not open.
# Re-enable verify_jwt = true on Supabase Cloud if your project accepts it without false rejects.
[functions.create-tracking-request]
verify_jwt = false

